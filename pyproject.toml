[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datalens"
version = "0.1.0"
description = "A small dataset-exploration and reporting toolkit built on pandas."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.16"]

[project.scripts]
datalens = "datalens.cli:main"

[tool.setuptools]
packages = ["datalens"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
